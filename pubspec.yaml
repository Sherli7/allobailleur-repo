name: rent_house
description: "Allô Bailleur is a comprehensive mobile app for real estate rentals in Cameroun, allowing users to search properties with advanced filters, save favorites, chat in real-time with owners, book securely, and manage listings—all powered by Firebase for seamless, real-time experiences."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2
  flutter_riverpod: ^3.0.3
  state_notifier: ^1.0.0

  # UI & Utils
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  flutter_rating_bar: ^4.0.1
  auto_size_text: ^3.0.0
  flutter_svg: ^2.0.10+1
  table_calendar: ^3.1.0

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.3
  firebase_messaging: ^15.1.3
  cloud_functions: ^5.1.0

  # Supabase
  supabase_flutter: ^2.6.0

  # Navigation
  go_router: ^17.0.0

  # Features
  image_picker: ^1.2.0
  google_maps_flutter: ^2.13.1
  google_sign_in: ^7.2.0
  permission_handler: ^12.0.1
  path: ^1.9.0

  # Payments
  flutter_stripe: ^10.1.0

  # DEPENDENCIES
  intl: ^0.20.2  # Version forcée pour compatibilité flutter_localizations
  cached_network_image: ^3.4.1
  flutter_dotenv: ^5.1.0
  flutter_image_compress: ^2.3.0
  flutter_local_notifications: ^19.5.0
  video_player: ^2.9.2
  chewie: ^1.8.1
  flutter_map: ^5.0.0
  latlong2: ^0.9.0
  http: ^1.1.0
  geolocator: ^9.0.2
  share_plus: ^7.2.2
  connectivity_plus: ^6.0.5
  url_launcher: ^6.3.0
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mockito: ^5.4.4
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - .env
